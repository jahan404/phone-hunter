        <section class="text-center py-4">

            </div>
        </section>
        <!-- spinner -->
        <section  id="loading-spinner" class="hidden text-center">
            <span class="loading loading-spinner loading-lg"></span>
        </section>
        <!-- phone cards -->

         </section>
        <!-- show more button -->
        <section class="text-center pb-5">
            <button onclick="ShowAll()" id="show-all-button" class="btn btn-primary">Show More</button>
        </section>
