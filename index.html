<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phone Hunter</title>


    

    
    <!-- tailwind+ daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="font-extrabold text-5xl text-center py-9">
        <h1>Welcome to my Phone Hunter!</h1>
    </header>
    <main class="container">
        <!-- search box + search button -->
        <section class="text-center py-4">
            <div class="mb-3 w-50">
                <input  id="user-input" type="text" placeholder="Type here" class="input input-bordered w-full max-w-xs" />
                <div onclick="setTimeOutFunc()" id="btn-search" class="btn btn-primary">Search</div>
            </div>
        </section>
        <!-- spinner -->
        <section  id="loading-spinner" class="hidden text-center">
            <span class="loading loading-spinner loading-lg"></span>
        </section>
        <!-- phone cards -->
         <section id="card-container" class="w-11/12 mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 py-9">

         </section>
        <!-- show more button -->
        <section class="text-center pb-5">
            <button onclick="ShowAll()" id="show-all-button" class="btn btn-primary">Show More</button>
        </section>

                <h3 class="text-warning">No Phone Found. Please try a new search</h3>
            </div>
            <div id="show-all" class="text-center d-none">
                <div id="btn-show-all" class="btn btn-primary">Show All</div>
            </div>
        </section> -->

                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </section> -->
        
        
        
        <!-- modal contents -->
        <section>    
            <!-- Open the modal using ID.showModal() method -->

<dialog id="my_modal" class="modal">
  <div class="modal-box">
    <div id="modal-content">

    </div>
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>
        </section>
    </main>



    
    <script src="js/functionality.js"></script>

</body>

</html>
